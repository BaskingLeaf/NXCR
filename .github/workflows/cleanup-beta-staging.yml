name: Clean completed Beta 1 release staging branch
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-beta-staging.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm real release exists and remove staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.4.1-beta.1 --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets --jq '.isPrerelease and (.assets | length == 3)' | grep -qx true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/v0.4.1-beta.1-staging"
          echo 'Staging branch cleaned; GitHub Release and source tag preserved.'
