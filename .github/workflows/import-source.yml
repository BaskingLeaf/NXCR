name: Import NXCR assembled source
on:
  push:
    paths:
      - source-archive.tar.xz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean public repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract audited source
        shell: bash
        run: |
          set -euxo pipefail
          echo "d78d28fbf043a2270d20b0c11cfb060b1b17e2bd5361851061edbf955275f373  source-archive.tar.xz" | sha256sum --check
          tar -tf source-archive.tar.xz
          tar -xJf source-archive.tar.xz
          test -s source/main.c
          test -s source/mkv.c
          test -s overlay/source/main.cpp
          test -s source/recorder.c
          test -s Makefile
          test -s scripts/package.sh
      - name: Commit readable source to main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile default_config.ini exefs.npdm sysmodule.json toolbox.json source/ overlay/Makefile overlay/source/main.cpp scripts/package.sh
          git rm -f source-archive.tar.xz
          git commit -m "Import readable NXCR v0.4.1 source from verified release build"
          git push origin HEAD:main
